<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link rel="stylesheet" href="style.css">

    <style>
        
    </style>

</head>

<body>
    <div class ="container">
    <h1 style="font-size:40px;">Checkout</h1>

    <p style="font-size: 15px;">Welcome to the checkout page!</p>

    <p>Please fill in the details below to complete your purchase</p>

    <h2>Customer Information</h2>

    <form><label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required>
    </form>

    <form><label for="LastName">Last Name:</label>
        <input type="text" id="LastName"name="Lastname" required>
    </form>

    <form><label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" required>
    </form>

    <h3 style="font-size: 20px;">Shipping Information</h3>

<form><label for="Country">Country:</label>
        <input type="text" id="Country" name="Country" required>
    </form>

  <form><label for="Address">Address:</label>
        <input type="text" id="Address" name="Address" required>
    </form>
     
    <form>
        <label for="Postcode">Postcode:</label>
        <input type="text" id="Postcode" name="Postcode" required>
    </form>

    <form>
        <label for="City">City:</label>
        <input type="text" id="City" name="City" required>
    </form>

<h4 style="font-size: 20px;">Transaction Details</h4>

<form>
    <label for="Card Holder Name">Card Holder Name:</label>
    <input type="text" id="Card Holder Name" name="Card Holder Name" required>
    </form>

    <form>
    <label for="Card Number">Card Number:</label>
    <input type="number" id="Card Number" name="Card Number" required>
    </form>

    <form>
    <label for="Expiry Date">Expiry Date:</label>
    <input type="month" id="Expiry Date" name="Expiry Date" required>
    </form>

    <form>
    <label for="CVV">CVV:</label>
    <input type="number" placeholder="123" min="100" max="999" id="CVV" name="CVV" required>
    </form>
<button style="margin-top: 20px;" onclick="window.location.href='summary.html'">Confirm</button>

</div>

        
    



    
</body>
</html>
